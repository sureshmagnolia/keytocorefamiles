<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Plant Family Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .option-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .screen {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .icon {
            width: 2.5rem;
            height: 2.5rem;
            margin-right: 1rem;
            flex-shrink: 0;
            color: #16a34a; /* green-600 */
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex items-center justify-center min-h-screen p-4">

    <div id="app" class="w-full max-w-3xl mx-auto">
        <div id="start-screen" class="screen text-center">
            <h1 class="text-4xl font-bold text-green-700 mb-4">Interactive Plant Family Key</h1>
            <p class="text-lg text-gray-600 mb-8">Welcome! This tool will help you identify a plant's family based on its characteristics. Click "Start" to begin the identification process.</p>
            <button id="start-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                Start Identification
            </button>
        </div>

        <div id="key-screen" class="hidden screen">
            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-lg">
                <!-- Progress Bar -->
                <div class="mb-4">
                    <div class="flex justify-between mb-1">
                        <span class="text-base font-medium text-green-700">Progress</span>
                        <span class="text-sm font-medium text-green-700" id="progress-text"></span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2.5">
                        <div id="progress-bar" class="bg-green-600 h-2.5 rounded-full" style="width: 0%"></div>
                    </div>
                </div>
                
                <!-- Breadcrumbs -->
                <div id="breadcrumbs" class="text-sm text-gray-500 mb-6 flex flex-wrap items-center gap-2"></div>

                <div id="question-container">
                    <h2 class="text-2xl font-semibold mb-2" id="question-title"></h2>
                    <p class="text-gray-600 mb-6" id="question-text"></p>
                    <div id="options-container" class="space-y-4">
                        <!-- Options will be dynamically inserted here -->
                    </div>
                </div>
            </div>
            <div class="text-center mt-6">
                 <button id="back-btn" class="bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-6 rounded-lg shadow-md transition duration-300 ease-in-out">Back</button>
            </div>
        </div>

        <div id="result-screen" class="hidden screen text-center">
             <div class="bg-white p-8 rounded-xl shadow-lg">
                <svg class="mx-auto h-16 w-16 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <h2 class="text-3xl font-bold text-green-700 mt-4 mb-2">Identification Complete!</h2>
                <p class="text-xl text-gray-700 mb-4">The plant family is likely:</p>
                <p id="result-text" class="text-4xl font-bold text-gray-900 bg-green-100 py-4 px-6 rounded-lg inline-block"></p>
            </div>
            <button id="restart-btn" class="mt-8 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
                Start Over
            </button>
        </div>
    </div>

    <script>
        const keyData = {
            '1': { question: 'How many perianth whorls are present?', A: { text: 'Two Whorls (Dichlamydeous)', next: '2' }, B: { text: 'One Whorl (Monochlamydeous)', next: '22' } },
            '2': { question: 'Are the petals free or fused?', A: { text: 'Petals Free (Polypetalae)', next: '3' }, B: { text: 'Petals Fused (Gamopetalae)', next: '15' } },
            '3': { question: 'What is the flower\'s ovary position?', A: { text: 'Hypogynous (Superior Ovary)', next: '4' }, B: { text: 'Perigynous or Epigynous (Inferior/Semi-inferior Ovary)', next: '13' } },
            '4': { question: 'Are the carpels free or fused?', A: { text: 'Carpels Free', next: '5' }, B: { text: 'Carpels Fused', next: '8' } },
            '5': { question: 'Is the plant aquatic or terrestrial?', A: { text: 'Aquatic Herbs with Numerous Floral Parts', result: 'NYMPHAEACEAE' }, B: { text: 'Terrestrial', next: '6' } },
            '6': { question: 'What is the plant\'s habit?', A: { text: 'Climbers with Unisexual Flowers', result: 'MENISPERMACEAE' }, B: { text: 'Herbs, Shrubs, or Trees', next: '7' } },
            '7': { question: 'Analyze the perianth and leaves.', A: { text: 'Numerous Perianth Lobes, Trees, Simple Leaves', result: 'MAGNOLIACEAE' }, B: { text: '5 Perianth Lobes, Herbs, Compound Leaves', result: 'RANUNCULACEAE' } },
            '8': { question: 'What is the flower\'s symmetry?', A: { text: 'Zygomorphic (Butterfly Shaped Corolla)', result: 'POLYGALACEAE' }, B: { text: 'Actinomorphic or Zygomorphic by Odd Petal/Stamen', next: '9' } },
            '9': { question: 'What type of placentation?', A: { text: 'Basal or Free Central, Petals Deeply Divided', result: 'CARYOPHYLLACEAE' }, B: { text: 'Axile or Parietal', next: '10' } },
            '10': { question: 'Are the stamens free or fused?', A: { text: 'Stamens Fused into a Tube', next: '11' }, B: { text: 'Stamens Free', next: '12' } },
            '11': { question: 'Analyze the leaves.', A: { text: 'Exstipulate, Pinnately Compound Leaves', result: 'MELIACEAE' }, B: { text: 'Stipulate, Simple Leaves', result: 'STERCULIACEAE' } },
            '12': { question: 'How many stamens?', A: { text: 'Numerous Stamens (>10)', result: 'CLUSIACEAE' }, B: { text: 'Few Stamens (<10)', result: 'SAPINDACEAE' } },
            '13': { question: 'How are the leaves arranged?', A: { text: 'Opposite', next: '14' }, B: { text: 'Alternate, Often Serrate', result: 'ROSACEAE' } },
            '14': { question: 'Are the leaves stipulate or exstipulate?', A: { text: 'Exstipulate', result: 'MELASTOMATACEAE' }, B: { text: 'Stipulate', result: 'RHIZOPHORACEAE' } },
            '15': { question: 'What is the ovary position?', A: { text: 'Inferior Ovary, Interpetiolar Stipules', result: 'RUBIACEAE' }, B: { text: 'Superior Ovary', next: '16' } },
            '16': { question: 'How are the stamens positioned relative to petals?', A: { text: 'Stamens Opposite to Petals', result: 'SAPOTACEAE' }, B: { text: 'Stamens Alternate to Petals', next: '17' } },
            '17': { question: 'What is the corolla symmetry?', A: { text: 'Actinomorphic or Zygomorphic by Uneven Limbs', next: '18' }, B: { text: 'Zygomorphic', next: '20' } },
            '18': { question: 'Analyze the leaves and ovules.', A: { text: 'Opposite Leaves, Numerous Ovules per Locule', result: 'GENTIANACEAE' }, B: { text: 'Alternate Leaves, 1-2 Ovules per Locule', next: '19' } },
            '19': { question: 'What is the plant\'s habit?', A: { text: 'Climbing Habit', result: 'CONVOLVULACEAE' }, B: { text: 'Not Climbing (Herbs, Shrubs, or Trees)', result: 'BORAGINACEAE' } },
            '20': { question: 'What type of placentation?', A: { text: 'Parietal Placentation, Axile on Fruits', result: 'PEDALIACEAE' }, B: { text: 'Axile Placentation', next: '21' } },
            '21': { question: 'Analyze the ovules.', A: { text: 'Numerous Ovules on Swollen Placenta', result: 'SCROPHULARIACEAE' }, B: { text: '1-2 Ovules in Each Cell', result: 'VERBENACEAE' } },
            '22': { question: 'Is the tepal whorl showy or not?', A: { text: 'Tepal Whorl Showy', next: '23' }, B: { text: 'Tepal Whorl Not Showy', next: '24' } },
            '23': { question: 'What type of ovary and fruit?', A: { text: 'Ovary Superior, Fruit is an Achene or Nut', result: 'NYCTAGINACEAE' }, B: { text: 'Ovary Inferior or Superior, Fruit is a Capsule', result: 'AIZOACEAE' } },
            '24': { question: 'What type of flowers?', A: { text: 'Unisexual, Flowers in Catkins', result: 'CASUARINACEAE' }, B: { text: 'Unisexual or Bisexual, Flowers Not in Catkins', next: '25' } },
            '25': { question: 'Analyze the flowers and leaves.', A: { text: 'Flowers Small, Leaves with Stinging Hairs', result: 'URTICACEAE' }, B: { text: 'Flowers Often Showy, Leaves without Stinging Hairs', result: 'EUPHORBIACEAE' } },
        };
        
        // Icons for visual aid
        const icons = {
            '1A': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 21a9 9 0 110-18 9 9 0 010 18zM9 15a6 6 0 110-12 6 6 0 010 12z"></path></svg>',
            '1B': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21a9 9 0 110-18 9 9 0 010 18z"></path></svg>',
            '2A': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg>',
            '2B': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
            '3A': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>',
            '3B': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>',
            '5A': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728m-9.9-2.829a5 5 0 010-7.07m7.072 0a5 5 0 010 7.07M12 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
            '5B': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m18 4v-4M3 10h18M4 10V4a2 2 0 012-2h12a2 2 0 012 2v6M12 21v-4"></path></svg>',
            '6A': '<svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>',
        };

        const startScreen = document.getElementById('start-screen');
        const keyScreen = document.getElementById('key-screen');
        const resultScreen = document.getElementById('result-screen');
        const app = document.getElementById('app');

        const startBtn = document.getElementById('start-btn');
        const backBtn = document.getElementById('back-btn');
        const restartBtn = document.getElementById('restart-btn');

        const questionTitle = document.getElementById('question-title');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const resultText = document.getElementById('result-text');
        
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const breadcrumbs = document.getElementById('breadcrumbs');

        let history = [];
        let choiceTextHistory = []; // To store descriptive choices
        let currentStep = '1';
        const totalSteps = Object.keys(keyData).length;

        function showScreen(screen) {
            startScreen.classList.add('hidden');
            keyScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            
            app.prepend(screen); // Prepend to allow animation on entrance
            screen.classList.remove('hidden');
        }

        function updateProgress() {
            const progress = Math.max(5, (history.length / (totalSteps/2)) * 100); // Heuristic for progress
            const progressPercentage = `${Math.min(100, progress)}%`;
            progressBar.style.width = progressPercentage;
            progressText.textContent = `${history.length} steps taken`;
        }
        
        function updateBreadcrumbs() {
            breadcrumbs.innerHTML = '<span class="font-semibold text-gray-700">Path:</span>';
            if (choiceTextHistory.length === 0) {
                 breadcrumbs.innerHTML += '<span>Start</span>';
                 return;
            }
            choiceTextHistory.forEach((choiceText, index) => {
                breadcrumbs.innerHTML += `
                    <span class="text-gray-400">&gt;</span>
                    <span class="font-medium text-green-700">${choiceText}</span>
                `;
            });
        }

        function displayStep(step) {
            const stepData = keyData[step];
            currentStep = step;

            questionTitle.textContent = `Step ${step}`;
            questionText.textContent = stepData.question;
            optionsContainer.innerHTML = '';

            const createOptionCard = (optionData, key) => {
                const choiceId = `${step}${key}`;
                const iconHTML = icons[choiceId] || `<div class="icon bg-gray-200 rounded-md"></div>`;

                const card = document.createElement('div');
                card.className = 'option-card bg-gray-50 hover:bg-green-100 p-4 rounded-lg cursor-pointer border-2 border-gray-200 hover:border-green-500 flex items-center';
                card.innerHTML = `
                    ${iconHTML}
                    <div>
                        <p class="text-lg font-medium">${key}. ${optionData.text}</p>
                    </div>
                `;
                card.addEventListener('click', () => handleOptionClick(optionData, optionData.text));
                return card;
            };

            optionsContainer.appendChild(createOptionCard(stepData.A, 'A'));
            optionsContainer.appendChild(createOptionCard(stepData.B, 'B'));
            
            backBtn.style.display = history.length > 0 ? 'inline-block' : 'none';
            updateProgress();
            updateBreadcrumbs();
        }

        function handleOptionClick(optionData, choiceText) {
            history.push(currentStep);
            
            const shortText = choiceText.split('(')[0].split(',')[0].trim();
            choiceTextHistory.push(shortText);

            if (optionData.result) {
                showResult(optionData.result);
            } else if (optionData.next) {
                displayStep(optionData.next);
            }
        }
        
        function goBack() {
            if (history.length > 0) {
                const previousStep = history.pop();
                choiceTextHistory.pop();
                displayStep(previousStep);
            }
        }

        function showResult(result) {
            resultText.textContent = result;
            showScreen(resultScreen);
        }

        function reset() {
            history = [];
            choiceTextHistory = [];
            currentStep = '1';
            updateProgress();
            updateBreadcrumbs();
            showScreen(startScreen);
        }

        startBtn.addEventListener('click', () => {
            displayStep('1');
            showScreen(keyScreen);
        });
        
        backBtn.addEventListener('click', goBack);
        restartBtn.addEventListener('click', reset);

    </script>
</body>
</html>
